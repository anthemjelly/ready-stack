[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ready-python-docker-webapi"
version = "0.1.0"
description = "FastAPI + async SQLAlchemy + PostgreSQL 示範服務（ready-stack）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ready-stack" }]
keywords = ["fastapi", "sqlalchemy", "postgresql", "alembic", "docker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.7",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.5.0",
  "pyright>=1.1.380",
  "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/anthemjelly/ready-stack"
Repository = "https://github.com/anthemjelly/ready-stack"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "alembic",
  "alembic.ini",
  "docker",
  "tests",
  "Makefile",
  "compose.yml",
  "Dockerfile",
  "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
# 本地用 `.venv`；如 venv 不存在（例如 CI 直接裝在 system Python）pyright 會 fallback。
venvPath = "."
venv = ".venv"
include = ["app", "tests", "alembic"]
exclude = [".venv", "**/__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
