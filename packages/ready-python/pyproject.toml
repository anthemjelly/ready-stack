[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ready-python"
description = "ready-stack 的 Python 專案起手模板：src layout、ruff、pyright、pytest 與多階段 Dockerfile"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ready-stack contributors" }]
keywords = ["template", "python", "docker", "starter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "pre-commit>=3.7",
]

[project.scripts]
ready-python = "ready_python.cli:main"

[project.urls]
Homepage = "https://github.com/anthemjelly/ready-stack"
Repository = "https://github.com/anthemjelly/ready-stack"
Source = "https://github.com/anthemjelly/ready-stack/tree/main/packages/ready-python"

# 版本號單一來源：src/ready_python/__init__.py 的 __version__
[tool.hatch.version]
path = "src/ready_python/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ready_python"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# --------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["ready_python"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ------------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

# ----------------------------------------------------------------- pyright ----
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests"]
